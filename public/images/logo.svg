<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#4F46E5" opacity="0.1"/>
  
  <!-- DNA Helix Symbol -->
  <g transform="translate(100, 100)">
    <!-- Left Strand -->
    <path d="M -30,-60 Q -35,-40 -30,-20 Q -25,0 -30,20 Q -35,40 -30,60" 
          stroke="#4F46E5" stroke-width="4" fill="none"/>
    
    <!-- Right Strand -->
    <path d="M 30,-60 Q 35,-40 30,-20 Q 25,0 30,20 Q 35,40 30,60" 
          stroke="#4F46E5" stroke-width="4" fill="none"/>
    
    <!-- Connecting Lines -->
    <line x1="-30" y1="-50" x2="30" y2="-50" stroke="#7C3AED" stroke-width="2"/>
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#7C3AED" stroke-width="2"/>
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#7C3AED" stroke-width="2"/>
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#7C3AED" stroke-width="2"/>
    <line x1="-30" y1="30" x2="30" y2="30" stroke="#7C3AED" stroke-width="2"/>
    <line x1="-30" y1="50" x2="30" y2="50" stroke="#7C3AED" stroke-width="2"/>
    
    <!-- Nodes -->
    <circle cx="-30" cy="-50" r="4" fill="#4F46E5"/>
    <circle cx="30" cy="-50" r="4" fill="#4F46E5"/>
    <circle cx="-30" cy="-30" r="4" fill="#4F46E5"/>
    <circle cx="30" cy="-30" r="4" fill="#4F46E5"/>
    <circle cx="-30" cy="-10" r="4" fill="#4F46E5"/>
    <circle cx="30" cy="-10" r="4" fill="#4F46E5"/>
    <circle cx="-30" cy="10" r="4" fill="#4F46E5"/>
    <circle cx="30" cy="10" r="4" fill="#4F46E5"/>
    <circle cx="-30" cy="30" r="4" fill="#4F46E5"/>
    <circle cx="30" cy="30" r="4" fill="#4F46E5"/>
    <circle cx="-30" cy="50" r="4" fill="#4F46E5"/>
    <circle cx="30" cy="50" r="4" fill="#4F46E5"/>
  </g>
  
  <!-- Microscope Icon -->
  <g transform="translate(55, 140)">
    <circle cx="0" cy="0" r="8" fill="#4F46E5"/>
    <rect x="-2" y="0" width="4" height="20" fill="#4F46E5"/>
    <rect x="-10" y="20" width="20" height="3" fill="#4F46E5"/>
  </g>
  
  <!-- Beaker Icon -->
  <g transform="translate(145, 140)">
    <path d="M -6,-10 L -4,-10 L 0,8 L 4,-10 L 6,-10 L 8,10 Q 8,12 6,12 L -6,12 Q -8,12 -8,10 Z" 
          fill="none" stroke="#4F46E5" stroke-width="2"/>
    <line x1="-4" y1="-10" x2="-4" y2="-12" stroke="#4F46E5" stroke-width="2"/>
    <line x1="4" y1="-10" x2="4" y2="-12" stroke="#4F46E5" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="#4F46E5">SR Blog</text>
</svg>
